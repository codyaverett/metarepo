name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: CI only reads the repository. Jobs that need more declare it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --locked --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --locked --verbose --all

    - name: Run tests
      run: cargo test --locked --verbose --all

    # Dogfood the external plugin path end to end: install the extracted
    # rules and mcp plugins the way a user would (cargo install to
    # ~/.cargo/bin, where the version-pinned specs in this workspace's .meta
    # resolve), then drive them through the meta binary. This exercises the
    # plugin wire protocol (GetInfo/RegisterCommands) and protocol 1.3
    # takeover exec dispatch on every push.
    - name: Install external plugins (dogfood)
      run: |
        cargo install --path plugins/metarepo-plugin-rules --debug --locked --force
        cargo install --path plugins/metarepo-plugin-mcp --debug --locked --force

    - name: Smoke test external plugins via meta
      run: |
        set -eux
        ./target/debug/meta plugin list
        ./target/debug/meta plugin list | grep -q 'rules'
        ./target/debug/meta plugin list | grep -q 'mcp'
        ./target/debug/meta rules list
        ./target/debug/meta mcp list
        # serve must answer an MCP initialize over stdio through takeover exec
        printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}\n' \
          | ./target/debug/meta mcp serve | head -1 | grep -q '"protocolVersion"'

    # Dogfood the rules plugin on this workspace's own conventions (#140).
    # Non-blocking for now: the goal is to learn which validators earn their
    # keep before making it a gate. Rules live in .rules.yaml at the root.
    - name: Check workspace rules (dogfood, non-blocking)
      continue-on-error: true
      run: ./target/debug/meta rules check

  examples:
    name: Examples
    runs-on: ubuntu-latest
    # The example crates under examples/ are deliberately excluded from the
    # workspace so they build the way an out-of-tree consumer would. That also
    # means `cargo build --all` never touches them, so they rot silently — the
    # plugin example once sat on an SDK requirement 34 minor versions stale and
    # no longer compiled. This job builds and tests each one on its own.
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    # Not --locked: each example keeps its own lockfile, and every version bump
    # in the workspace would otherwise fail the job on a stale path-dep entry.
    - name: Build and test each example crate
      run: |
        set -eu
        # Every Cargo.toml directly under examples/<crate>/ is one example crate.
        manifests=$(find examples -mindepth 2 -maxdepth 2 -name Cargo.toml | sort)
        if [ -z "$manifests" ]; then
          echo "No example crates found under examples/ — did the layout change?" >&2
          exit 1
        fi
        for manifest in $manifests; do
          echo "::group::$manifest"
          cargo fmt --manifest-path "$manifest" -- --check
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --manifest-path "$manifest"
          echo "::endgroup::"
        done

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch

    - name: Cache cargo registry
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-release-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release
      run: cargo build --release --locked --verbose --all

    - name: Check release binary
      run: |
        ./target/release/meta --version
        ./target/release/meta --help

  cross-platform:
    name: Cross-platform Build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch

    - name: Build
      run: cargo build --locked --verbose --all

    - name: Run tests
      run: cargo test --locked --verbose --all
