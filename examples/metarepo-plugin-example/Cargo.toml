[package]
name = "metarepo-plugin-example"
version = "0.1.0"
edition = "2021"
authors = ["Metarepo Contributors"]
description = "Example external plugin for metarepo CLI, built on metarepo-plugin-sdk"
documentation = "https://github.com/codyaverett/metarepo"
homepage = "https://github.com/codyaverett/metarepo"
repository = "https://github.com/codyaverett/metarepo"
license = "MIT"
keywords = ["metarepo", "plugin", "meta", "monorepo", "example"]
categories = ["development-tools"]

[dependencies]
# Path-only on purpose: this example lives in the metarepo tree and must build
# against the SDK sources beside it. A version requirement here would go stale on
# every SDK release (it did — it sat at 0.20 while the SDK reached 0.54, and
# nothing caught it because this crate is excluded from the workspace). An
# out-of-tree plugin would instead depend on the published crate:
#     metarepo-plugin-sdk = "0.54"
metarepo-plugin-sdk = { path = "../../metarepo-plugin-sdk" }
anyhow = "1.0"
# Needed to derive the typed settings struct read via plugin_config.
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
# Test-only: builds the [example] config block the settings tests read back.
serde_json = "1.0"

[[bin]]
name = "metarepo-plugin-example"
path = "src/main.rs"

[lib]
name = "metarepo_plugin_example"
path = "src/lib.rs"
